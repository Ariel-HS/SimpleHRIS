services:
  oracle-db:
    image: gvenzl/oracle-free:slim
    container_name: oracle-db
    environment:
      - ORACLE_PASSWORD=oracle
      - APP_USER=SYSTEM              
      - APP_USER_PASSWORD=oracle      
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  oracle_data: